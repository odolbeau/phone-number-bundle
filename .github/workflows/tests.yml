on: [pull_request]
name: PHPUnit

jobs:
  tests:
    name: Tests
    runs-on: Ubuntu-24.04

    strategy:
      matrix:
        include:
          # Lowest Deps
          - php: 8.1
            symfony-require: 6.4.*
            composer-flags: '--prefer-stable --prefer-lowest'
          # LTS with latest stable PHP
          - php: 8.2
            symfony-require: 6.4.*
            composer-flags: '--prefer-stable'
          - php: 8.3
            symfony-require: 7.4.*
            composer-flags: '--prefer-stable'
          # Active release
          - php: 8.4
            symfony-require: 8.1.*
            composer-flags: '--prefer-stable'
          # Development release
          - php: nightly
            symfony-require: 8.2.*@dev
            composer-flags: '--ignore-platform-req=php+'
            stability: dev
            can-fail: true
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl-74.1
          coverage: none
          # SYMFONY_REQUIRE below is only honored by the Flex plugin.
          tools: flex

      - name: Configure Composer minimum stability
        if: matrix.stability
        run: composer config minimum-stability ${{ matrix.stability }}

      # symfony/object-mapper doesn't exist on Symfony 6.4.
      - name: Remove the ObjectMapper on Symfony 6.4
        if: matrix.symfony-require == '6.4.*'
        run: composer remove --dev --no-update symfony/object-mapper

      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-require }}
        run: composer update ${{ matrix.composer-flags }} --no-interaction --no-progress --optimize-autoloader

      - name: Run PHPUnit
        run: vendor/bin/phpunit
